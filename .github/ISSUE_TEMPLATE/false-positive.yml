name: False positive
description: diff-gate flagged something that is actually fine
title: "false positive: "
labels: ["false-positive"]
body:
  - type: markdown
    attributes:
      value: A false BLOCK is the worst bug in this project, so thank you for reporting it. No reproduction repo needed.
  - type: textarea
    id: finding
    attributes:
      label: The finding
      description: Paste the line diff-gate printed.
      render: text
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: The code it fired on
      description: The import, definition or dependency in question.
      render: text
    validations:
      required: true
  - type: dropdown
    id: shape
    attributes:
      label: Project shape
      multiple: true
      options:
        - monorepo or workspaces
        - TypeScript path aliases
        - Python virtualenv
        - bundler-specific imports (Vite, Next, webpack)
        - plain single package
        - something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Node version
      placeholder: v22.x
